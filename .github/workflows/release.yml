name: publish
on:
    release:
        types: [published] 
    
    workflow_dispatch:

jobs:
    pypi-publish:

        name: Upload release to PyPI
        runs-on: ubuntu-latest

        environment: 
            name: pypi
            url: https://pypi.org/p/mcp-server-for-oscal
        permissions:
            id-token: write  # IMPORTANT: this permission is mandatory for trusted publishing
        # retrieve your distributions here
        steps:
        -   name: Check out the repository
            uses: actions/checkout@v4        
        -   name: Download release assets
            env:
                GH_TOKEN: ${{ github.token }}
            run: |
                mkdir dist
                gh release download ${{ github.event.release.tag_name }} \
                -D dist/ \
                --pattern "*.whl" \
                --pattern "*.tar.gz"


        -   name: Publish package distributions to PyPI
            uses: pypa/gh-action-pypi-publish@release/v1
            # uncomment for testing
            # with:
            #     repository-url: https://test.pypi.org/legacy/

    mcp-registry-publish:

        name: Publish to MCP Registry
        runs-on: ubuntu-latest
        needs: [pypi-publish]

        environment: 
            name: MCP Registry
            url: https://registry.modelcontextprotocol.io/?q=mcp-server-for-oscal

        permissions:
            id-token: write  # Required for GitHub OIDC authentication with MCP Registry
            contents: read

        steps:
        -   name: Check out the repository
            uses: actions/checkout@v4

        -   name: Set up Node.js
            uses: actions/setup-node@v4
            with:
                node-version: '20'

        -   name: Extract version from release tag
            id: version
            run: |
                TAG="${{ github.event.release.tag_name }}"
                VERSION="${TAG#v}"
                echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
                echo "Extracted version: ${VERSION}"

        -   name: Update server.json version fields
            run: |
                VERSION="${{ steps.version.outputs.version }}"
                jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp.json
                mv server.tmp.json server.json

        -   name: Validate server.json version update
            run: |
                VERSION="${{ steps.version.outputs.version }}"
                TOP_VERSION=$(jq -r '.version' server.json)
                PKG_VERSION=$(jq -r '.packages[0].version' server.json)
                if [ "$TOP_VERSION" != "$VERSION" ] || [ "$PKG_VERSION" != "$VERSION" ]; then
                    echo "::error::Version mismatch: expected ${VERSION}, got top-level=${TOP_VERSION}, package=${PKG_VERSION}"
                    exit 1
                fi
                echo "server.json version fields updated to ${VERSION}"
                cat server.json

        -   name: Publish to MCP Registry
            continue-on-error: true
            run: |
                curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher && sudo mv mcp-publisher /usr/local/bin/
                mcp-publisher login github-oidc
                mcp-publisher publish

